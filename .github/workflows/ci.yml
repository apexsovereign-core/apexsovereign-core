name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, refactor/sovereign-exchange]

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, routing, build, tests, and secret scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install JavaScript dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Routing verification
        run: bun run verify:routing

      - name: Production build
        run: bun run build

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Backend tests
        run: python -m pytest backend/tests -q

      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --redact --config=artifacts/task5/gitleaks-working-tree.toml
