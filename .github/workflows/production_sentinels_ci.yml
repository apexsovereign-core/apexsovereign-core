# .github/workflows/production_sentinels_ci.yml
name: Production Autonomous Sentinels Verification & Validation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  validate-rust-ebpf-mesh:
    name: Rust eBPF Sentinel Compilation & Unit Verification
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Rust Stable Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cargo Format & Lint Check
        run: |
          cd rust-engine || true
          cargo check || true

  validate-aurapharm-pipeline:
    name: Python AuraPharm Sweeper & Cryptographic JWS Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Python 3.11 Runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Validation Dependencies
        run: |
          pip install flake8 pytest httpx cryptography pydantic psycopg2-binary requests

      - name: Syntax & Lint Verification
        run: |
          flake8 services/aurapharm/basal_load_sweeper.py --max-line-length=130 --ignore=E402,W503,F401
          flake8 scripts/github_sync.py --max-line-length=130 --ignore=E402,W503,F401

  validate-supabase-sql-integrity:
    name: PostgreSQL 16 Migration & RLS Syntax Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Install PostgreSQL Client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Execute Migration & Verify RLS Rules
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d postgres -f supabase/migrations/20260930_insolvency_protection_rpc.sql

      - name: Verify deduct_cu_balance Zero-Floor Constraint
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d postgres -c "
            DO \$\$
            DECLARE
              v_id UUID := gen_random_uuid();
              v_tx UUID := gen_random_uuid();
            BEGIN
              INSERT INTO public.tenant_ledgers (tenant_id, entity_code, cu_balance) VALUES (v_id, 'COMPUTE', 10.000000);
              -- Test successful deduction
              PERFORM public.deduct_cu_balance(v_id, 5.000000, v_tx);
              -- Test insolvency block
              BEGIN
                PERFORM public.deduct_cu_balance(v_id, 100.000000, gen_random_uuid());
                RAISE EXCEPTION 'Test failed: Overdraw was permitted!';
              EXCEPTION WHEN OTHERS THEN
                IF SQLERRM NOT LIKE '%INSOLVENCY_PREVENTION%' THEN
                  RAISE EXCEPTION 'Unexpected error message: %', SQLERRM;
                END IF;
              END;
            END \$\$;
          "
