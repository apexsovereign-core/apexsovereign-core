<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <!-- Radiant Primary Cyan Gradient (#00f0ff -> #0088cc) -->
    <linearGradient id="apexCyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="20%" stop-color="#70F7FF" />
      <stop offset="55%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#0088CC" />
    </linearGradient>

    <!-- Core Facet Specular Highlight -->
    <linearGradient id="coreSpecular" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E0FCFF" />
      <stop offset="40%" stop-color="#38DDF8" />
      <stop offset="85%" stop-color="#00A2E8" />
      <stop offset="100%" stop-color="#006699" />
    </linearGradient>

    <!-- Deep Obsidian Left-Facet Gradient -->
    <linearGradient id="obsidianLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0C1B2E" />
      <stop offset="50%" stop-color="#060F1A" />
      <stop offset="100%" stop-color="#02050A" />
    </linearGradient>

    <!-- Deep Obsidian Right-Facet Gradient -->
    <linearGradient id="obsidianRight" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#122A47" />
      <stop offset="60%" stop-color="#091729" />
      <stop offset="100%" stop-color="#040912" />
    </linearGradient>

    <!-- Glowing Cyan Drop Shadow Filter -->
    <filter id="radiantCyanGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Ambient Outer Cyan Glow Silhouette -->
  <polygon
    points="100,10 190,100 100,190 10,100"
    fill="none"
    stroke="#00F0FF"
    stroke-width="8"
    stroke-opacity="0.35"
    filter="url(#radiantCyanGlow)"
  />

  <!-- Outer Diamond Base Hull -->
  <polygon
    points="100,10 190,100 100,190 10,100"
    fill="#030812"
    stroke="url(#apexCyanGrad)"
    stroke-width="3.5"
    stroke-linejoin="round"
  />

  <!-- Faceted Quadrant Planes -->
  <!-- Upper Left Facet -->
  <polygon
    points="100,10 10,100 100,100"
    fill="url(#obsidianLeft)"
    stroke="url(#apexCyanGrad)"
    stroke-width="0.8"
    stroke-opacity="0.4"
  />

  <!-- Upper Right Facet -->
  <polygon
    points="100,10 190,100 100,100"
    fill="url(#obsidianRight)"
    stroke="url(#apexCyanGrad)"
    stroke-width="0.8"
    stroke-opacity="0.4"
  />

  <!-- Lower Left Facet -->
  <polygon
    points="10,100 100,190 100,100"
    fill="#050B14"
    stroke="url(#apexCyanGrad)"
    stroke-width="0.8"
    stroke-opacity="0.4"
  />

  <!-- Lower Right Facet -->
  <polygon
    points="190,100 100,190 100,100"
    fill="#081424"
    stroke="url(#apexCyanGrad)"
    stroke-width="0.8"
    stroke-opacity="0.4"
  />

  <!-- Cardinal Precision Seam Beams -->
  <line x1="100" y1="10" x2="100" y2="190" stroke="url(#apexCyanGrad)" stroke-width="1.5" stroke-linecap="round" opacity="0.85" />
  <line x1="10" y1="100" x2="190" y2="100" stroke="url(#apexCyanGrad)" stroke-width="1.5" stroke-linecap="round" opacity="0.85" />

  <!-- Intermediate Geometric Diamond Inset Matrix -->
  <polygon
    points="100,38 162,100 100,162 38,100"
    fill="none"
    stroke="url(#apexCyanGrad)"
    stroke-width="1.8"
    stroke-dasharray="4 3"
    opacity="0.6"
  />

  <!-- Inner Faceted Radiant Core Diamond -->
  <polygon
    points="100,56 144,100 100,144 56,100"
    fill="url(#coreSpecular)"
    stroke="#FFFFFF"
    stroke-width="1.5"
    stroke-opacity="0.9"
  />

  <!-- Central Cryptographic Solid Diamond Spark -->
  <polygon points="100,78 122,100 100,122 78,100" fill="#FFFFFF" opacity="0.95" />
  <polygon points="100,85 115,100 100,115 85,100" fill="#00F0FF" />

  <!-- Precision Corner Calibrations -->
  <circle cx="100" cy="10" r="2.5" fill="#00F0FF" />
  <circle cx="190" cy="100" r="2.5" fill="#00F0FF" />
  <circle cx="100" cy="190" r="2.5" fill="#00F0FF" />
  <circle cx="10" cy="100" r="2.5" fill="#00F0FF" />
</svg>